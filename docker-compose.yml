services:
  mongo_db:
    image: mongo:latest
    container_name: library_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: books
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:latest
    container_name: book-cache
    ports:
      - "6379:6379"
    restart: always

  app:
    build: .
    container_name: library_api
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: mongodb://mongo_admin:password@mongo_db:27017
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongo_db
      - redis

volumes:
  mongo_data: